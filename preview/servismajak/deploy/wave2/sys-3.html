<div class="col-sm-6 col-md-4 mb-3">
  <div class="card card-transition h-100 mm-svc-card" style="border-radius: 1.15rem; border: 1px solid #e5e6ef;">
    <div class="card-body" style="padding: 1.2rem 1.25rem;">
      <div class="d-flex align-items-center mb-3">
        <div class="flex-shrink-0">
          <a href="{SYS-3.URL}"><img class="avatar avatar-sm avatar-4x4" src="{SYS-3.IMG}" alt="{SYS-3.NAME}"></a>
        </div>
        <div class="flex-grow-1 ms-3 min-w-0">
          <h4 class="mb-0" style="margin:0; font-size: 1rem; font-weight: 800;">
            <a class="text-dark text-decoration-none" href="{SYS-3.URL}" style="color: #1B2848 !important;">{SYS-3.NAME}</a>
          </h4>
          <small class="text-muted">{SYS-3.NAME-APPEND}</small>
        </div>
      </div>
      <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
        <span style="font-size: 1.05rem; font-weight: 800; color: #1B2848;">{SYS-3.PRICE}</span>
        <div class="d-flex align-items-center gap-2">
          <span class="badge bg-dark" style="padding: 0.55em 0.65em;">
            <i class="fa-duotone fa-clock"></i> {SYS-3.TIME}
          </span>
          {SYS-3.BUTTON}
        </div>
      </div>
    </div>
  </div>
</div>
