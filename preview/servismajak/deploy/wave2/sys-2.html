<!-- Wave2 SYS-2 — výpis služeb (PC) -->
<div class="col-sm-6 col-md-4 col-lg-3 mb-3 mb-md-0 mobile-false">
  <div class="card card-transition h-100 mm-svc-card" style="border-radius: 1.15rem; border: 1px solid #e5e6ef;">
    <a href="{SYS-2.URL}" class="d-block">
      <img class="card-img-top" src="{SYS-2.IMG}" alt="{SYS-2.NAME}" style="object-fit: cover; max-height: 140px;">
    </a>
    <div class="card-body d-flex flex-column" style="padding: 1.15rem 1.2rem;">
      <a href="{SYS-2.URL}" class="text-decoration-none">
        <h4 class="card-title mb-1" style="color: #1B2848; font-weight: 800; font-size: 1rem;">{SYS-2.NAME}</h4>
        <small class="text-muted d-block mb-2">{SYS-2.NAME-APPEND}</small>
      </a>
      <div class="mt-auto d-flex align-items-center justify-content-between gap-2">
        <span class="mm-svc-price" style="font-size: 1.05rem; font-weight: 800; color: #1B2848;">{SYS-2.PRICE}</span>
        <span class="badge bg-dark" style="padding: .45em .6em;"><i class="fa-duotone fa-clock"></i> {SYS-2.TIME}</span>
      </div>
      <a href="{SYS-2.URL}" class="btn btn-primary btn-sm btn-block mt-3" style="border-radius: 10px; font-weight: 700;">Zobrazit více</a>
    </div>
  </div>
</div>
<!-- Wave2 SYS-2 — výpis služeb (mobil) -->
<div class="col-12 mb-2 mobile-true">
  <a href="{SYS-2.URL}" class="card card-transition h-100 text-decoration-none mm-svc-row" style="border-radius: 1rem; border: 1px solid #e5e6ef; display: block;">
    <div class="card-body" style="padding: 1rem 1.1rem;">
      <div class="d-flex align-items-center gap-3">
        <img class="avatar avatar-sm avatar-4x4 flex-shrink-0" src="{SYS-2.IMG}" alt="{SYS-2.NAME}">
        <div class="flex-grow-1 min-w-0">
          <h4 class="mb-0" style="color: #1B2848; font-weight: 800; font-size: .95rem;">{SYS-2.NAME}</h4>
          <small class="text-muted">{SYS-2.NAME-APPEND}</small>
        </div>
        <div class="text-end flex-shrink-0">
          <div style="font-weight: 800; color: #2F5BFF; white-space: nowrap;">{SYS-2.PRICE}</div>
          <small class="text-muted"><i class="fa-duotone fa-clock"></i> {SYS-2.TIME}</small>
        </div>
      </div>
    </div>
  </a>
</div>
