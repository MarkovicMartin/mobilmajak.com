<div class="col-6 col-md-3 mb-3">
  <div class="card card-bordered card-transition shadow-none h-100 mm-cat-card" style="border-radius: 1.1rem; border: 1px solid #e5e6ef;">
    <a class="card-body text-decoration-none" style="padding: 1.1rem 1.25rem;" href="{SYS-1.URL}">
      <div class="d-flex align-items-center">
        <div class="flex-shrink-0">
          <img class="img-fluid" style="width: 36px; height: 36px; object-fit: contain;" src="{SYS-1.IMG}" alt="Zařízení: {SYS-1.TITLE}">
        </div>
        <div class="flex-grow-1 ms-3">
          <h3 class="h6 card-title mb-1" style="color: #1B2848; font-weight: 800;">{SYS-1.TITLE}</h3>
          <p class="card-text small mb-0" style="color: #2F5BFF; font-weight: 700;">Vybrat model <i class="fa-light fa-angle-right ms-1"></i></p>
        </div>
      </div>
    </a>
  </div>
</div>
