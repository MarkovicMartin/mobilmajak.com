<script>
/* MM_DEVICES from #mm-devices-json on homepage */
(function(){
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'');}
  function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
  function formatPrice(p){
    if(p==null||p==='')return '';
    var n=Number(p); if(!isFinite(n)) return String(p);
    return n.toLocaleString('cs-CZ')+' Kč';
  }
  function collectModels(node){
    var out=[];
    function walk(n, brand){
      var kids=n.children||[];
      if(!kids.length){ out.push({value:String(n.id),label:n.title,title:n.title,url:n.url,id:n.id,brand:brand}); return; }
      kids.forEach(function(c){ walk(c, brand||n); });
    }
    walk(node, node);
    return out.sort(function(a,b){return a.label.localeCompare(b.label,'cs');});
  }
  function createCombo(mount, opts){
    mount.innerHTML='';
    mount.classList.add('mm-finder-combo');
    var trigger=el('<button type="button" class="mm-finder-combo-trigger"><span><strong>'+opts.placeholder+'</strong><small>'+opts.hint+'</small></span></button>');
    var panel=el('<div class="mm-finder-combo-panel"><input type="search" placeholder="Psát pro hledání…" autocomplete="off"><ul class="mm-finder-combo-list"></ul></div>');
    mount.appendChild(trigger); mount.appendChild(panel);
    var input=panel.querySelector('input'); var listEl=panel.querySelector('ul');
    var options=[]; var value=''; var enabled=true;
    function close(){ mount.classList.remove('is-open'); }
    function open(){
      if(!enabled) return;
      document.querySelectorAll('.mm-finder-combo.is-open').forEach(function(c){ if(c!==mount) c.classList.remove('is-open'); });
      mount.classList.add('is-open'); input.value=''; render(''); input.focus();
    }
    function render(q){
      var nq=norm(q); listEl.innerHTML='';
      var filtered=options.filter(function(o){return !nq || norm(o.label).indexOf(nq)>=0;});
      if(!filtered.length){ listEl.appendChild(el('<li class="mm-finder-combo-empty">Nic nenalezeno</li>')); return; }
      filtered.slice(0,80).forEach(function(o){
        var li=document.createElement('li');
        var b=el('<button type="button"></button>'); b.textContent=o.label;
        if(String(o.value)===String(value)) b.classList.add('is-active');
        b.addEventListener('click', function(){ value=o.value; trigger.querySelector('strong').textContent=o.label; close(); opts.onChange(o); });
        li.appendChild(b); listEl.appendChild(li);
      });
    }
    trigger.addEventListener('click', function(){ mount.classList.contains('is-open')?close():open(); });
    input.addEventListener('input', function(){ render(input.value); });
    return {
      setOptions:function(next){
        options=next||[]; enabled=options.length>0; mount.classList.toggle('is-disabled',!enabled);
        value=''; trigger.querySelector('strong').textContent=opts.placeholder;
      },
      setValue:function(val){
        var opt=options.find(function(o){return String(o.value)===String(val);});
        if(!opt) return false; value=opt.value; trigger.querySelector('strong').textContent=opt.label; opts.onChange(opt); return true;
      }
    };
  }

  function parseServicesFromHtml(html, modelTitle){
    var doc=document.implementation.createHTMLDocument('');
    doc.documentElement.innerHTML=html;
    var out=[]; var seen={};
    doc.querySelectorAll('a[href]').forEach(function(a){
      var href=a.getAttribute('href')||'';
      if(!href || href.indexOf('/zarizeni/')>=0) return;
      if(href.indexOf('http')!==0 && href.charAt(0)!=='/') return;
      // product-like: no many path segments that are category
      var path=(href.split('?')[0]||'');
      if(/\/(pobocky|vyhledavani|hodnoceni|blog|vyzvednuti)/i.test(path)) return;
      var card=a.closest('.mm-service-row, .mm-svc-card, .card');
      if(!card) return;
      var title=(card.querySelector('.mm-service-main strong, h4,h3,.card-title')||a).textContent.trim();
      if(!title || title.length<4) return;
      var priceEl=card.querySelector('.mm-service-price, [style*="font-weight: 800"], .mm-svc-price, .card-body span');
      var priceTxt='';
      if(priceEl){
        var t=priceEl.textContent.trim();
        if(/\d/.test(t) && /Kč|Kc|CZK/i.test(t)) priceTxt=t;
      }
      // better: find Kč in card
      if(!priceTxt){
        var m=card.textContent.match(/(\d[\d\s]*\d|\d)\s*Kč/);
        if(m) priceTxt=m[0];
      }
      var key=href.replace(/#.*/,'');
      if(seen[key]) return; seen[key]=1;
      var abs=a.href;
      if(/servismajak\.cz\/(zarizeni|pobocky|vyhledavani|hodnoceni)/i.test(abs)) return;
      if(!/servismajak\.cz\//i.test(abs)) return;
      // skip pure category
      if(/\/zarizeni(\/|$)/i.test(abs)) return;
      out.push({value:key,label:title.replace(/\s+/g,' ').trim(),href:abs,price:priceTxt,rawPrice:priceTxt});
    });
    // prefer cards with Rezervovat nearby
    if(!out.length){
      doc.querySelectorAll('.mm-service-row, .mm-svc-card, .card.card-transition').forEach(function(card,i){
        var a=card.querySelector('a[href]');
        if(!a) return;
        var href=a.href;
        if(/\/zarizeni\//i.test(href)) return;
        var title=(card.querySelector('.mm-service-main strong, h4,h3')||a).textContent.trim();
        var m=card.textContent.match(/(\d[\d\s]*\d|\d)\s*Kč/);
        out.push({value:href,label:title,href:href,price:m?m[0]:'',rawPrice:m?m[0]:''});
      });
    }
    // unique by href
    var u={}, res=[];
    out.forEach(function(o){ if(u[o.href]) return; u[o.href]=1; res.push(o); });
    return res;
  }

  function initFinder(){
    var root=document.querySelector('[data-mm-finder]');
    if(!root) return;
    var roots=(window.MM_DEVICES&&MM_DEVICES.roots)||[];
    var priceEl=root.querySelector('[data-mm-price]');
    var btn=root.querySelector('[data-mm-btn]');
    var selectedType=null, selectedBrand=null, selectedModel=null, selectedService=null;

    function syncBtn(){
      if(!btn) return;
      if(selectedService && selectedService.href){ btn.href=selectedService.href; btn.textContent='Zobrazit detail opravy'; }
      else if(selectedModel && selectedModel.url){ btn.href='/zarizeni/'+selectedModel.url; btn.textContent='Zobrazit opravy modelu'; }
      else if(selectedBrand && selectedBrand.url){ btn.href='/zarizeni/'+selectedBrand.url; btn.textContent='Zobrazit značku'; }
      else { btn.href='/zarizeni/'; btn.textContent='Vybrat v katalogu'; }
    }

    var serviceCombo=createCombo(root.querySelector('[data-mm-combo="service"]'),{
      hint:'Vybraná oprava', placeholder:'Vyberte opravu',
      onChange:function(opt){ selectedService=opt; if(priceEl) priceEl.textContent=opt.price||''; syncBtn(); }
    });
    var modelCombo=createCombo(root.querySelector('[data-mm-combo="model"]'),{
      hint:'Vybraný model', placeholder:'Vyberte model',
      onChange:function(opt){
        selectedModel=opt; selectedService=null; if(priceEl) priceEl.textContent='';
        serviceCombo.setOptions([{value:'_',label:'Načítám opravy…'}]);
        syncBtn();
        var url='/zarizeni/'+(opt.url||'');
        fetch(url,{credentials:'same-origin'}).then(function(r){return r.text();}).then(function(html){
          var list=parseServicesFromHtml(html, opt.title);
          if(!list.length){
            serviceCombo.setOptions([]);
            if(priceEl) priceEl.textContent='';
            return;
          }
          serviceCombo.setOptions(list);
        }).catch(function(){ serviceCombo.setOptions([]); });
      }
    });
    var brandCombo=createCombo(root.querySelector('[data-mm-combo="brand"]'),{
      hint:'Vybraná značka', placeholder:'Vyberte značku',
      onChange:function(opt){
        selectedBrand=opt.node; selectedModel=null; selectedService=null; if(priceEl) priceEl.textContent='';
        modelCombo.setOptions(collectModels(opt.node));
        serviceCombo.setOptions([]);
        syncBtn();
      }
    });
    var typeCombo=createCombo(root.querySelector('[data-mm-combo="type"]'),{
      hint:'Typ zařízení', placeholder:'Vyberte typ',
      onChange:function(opt){
        selectedType=opt.node; selectedBrand=null; selectedModel=null; selectedService=null; if(priceEl) priceEl.textContent='';
        var brands=(opt.node.children||[]).slice().sort(function(a,b){return a.title.localeCompare(b.title,'cs');});
        brandCombo.setOptions(brands.map(function(b){return {value:String(b.id),label:b.title,node:b};}));
        modelCombo.setOptions([]); serviceCombo.setOptions([]); syncBtn();
      }
    });
    typeCombo.setOptions(roots.map(function(r){return {value:String(r.id),label:r.title,node:r};}));
    brandCombo.setOptions([]); modelCombo.setOptions([]); serviceCombo.setOptions([]); syncBtn();
    document.addEventListener('click', function(e){
      if(e.target.closest('.mm-finder-combo')) return;
      document.querySelectorAll('.mm-finder-combo.is-open').forEach(function(c){c.classList.remove('is-open');});
    });
    // default: phones
    if(roots[0]) typeCombo.setValue(String(roots[0].id));
  }

  function initChrome(){
    var oldAnnounce=document.getElementById('mm-announce');
    if(oldAnnounce) oldAnnounce.remove();
    var isHome = !!document.getElementById('mm-home') || location.pathname==='/' || /\/index\.php$/i.test(location.pathname);
    if(isHome){
      document.body.classList.add('mm-is-home');
      var homeEl=document.getElementById('mm-home');
      if(homeEl){
        var wrap=homeEl.closest('.mt-2,.mt-3,.mt-4');
        if(wrap){ wrap.classList.remove('mt-2','mt-3','mt-4'); wrap.style.marginTop='0'; wrap.style.paddingTop='0'; }
        var box=homeEl.closest('.container.container-xxl');
        if(box){ box.classList.remove('mt-4'); box.style.marginTop='0'; box.style.paddingTop='0'; }
      }
      // hide legacy home blocks (image, delivery, zanést, o nás stats if outside mm-home)
      document.querySelectorAll('.container.container-xxl .row > [class*="col"]').forEach(function(col){
        if(col.querySelector('#mm-home')) return;
        // keep branches heading / SYS-9 cards
        var t=(col.textContent||'');
        if(/Najděte nejbližší|Mobil Maják -/i.test(t) && col.querySelector('.card')) return;
        if(col.querySelector('#mm-home')) return;
        // hide if it's the old side image / delivery / zanést / o nás
        if(col.querySelector('img[src*="DSC03316"], img[src*="Prodejce"], img[src*="Majak_4"]') && !col.querySelector('#mm-home')){
          // might be delivery - hide
        }
        if(!col.querySelector('#mm-home') && (
          col.querySelector('img[src*="DSC03316"]') ||
          /Vyzvednutí zdarma|Opraveno za hodinu|Vaše zařízení můžete zdarma poslat|Vaše zařízení k nám můžete přinést|Tisíce baterií|Tisíce displejů/i.test(t)
        )){
          col.classList.add('mm-hide-legacy');
        }
      });
    }
    $('#myrepair-nav-chooseDevice').html('<a href="https://servismajak.cz/zarizeni/" class="btn btn-primary btn-sm">Vybrat zařízení</a>');
    $('#myrepair-nav-main').html('');
    $('img.img-fluid').each(function(){ if($(this).attr('src')==='') $(this).hide(); });

    // top search product suggest
    (function(){
      var $input=$('.js-form-search').first(); if(!$input.length) return;
      var $form=$input.closest('form.site-search'); if(!$form.length) return;
      var $box=$('<div class="mm-search-suggest" role="listbox"></div>'); $form.append($box);
      var timer=null,lastQ='';
      function parseProducts(html){
        var doc=document.implementation.createHTMLDocument(''); doc.documentElement.innerHTML=html; var out=[];
        doc.querySelectorAll('[data-search-section="products"] a.site-search-result').forEach(function(a){
          var titleEl=a.querySelector('.site-search-result-title'); var metaEl=a.querySelector('.site-search-result-meta');
          var title=titleEl?titleEl.textContent.trim():(a.textContent||'').trim();
          var price=metaEl?metaEl.textContent.trim():'';
          if(title&&a.href) out.push({title:title,price:price,href:a.href});
        }); return out;
      }
      function render(items){
        if(!items.length){$box.removeClass('is-open').empty();return;}
        $box.html(items.slice(0,7).map(function(p){
          return '<a href="'+p.href+'"><span>'+$('<div>').text(p.title).html()+'</span>'+(p.price?'<span class="mm-price">'+$('<div>').text(p.price).html()+'</span>':'')+'</a>';
        }).join('')).addClass('is-open');
      }
      $input.on('input', function(){
        var q=($input.val()||'').trim(); clearTimeout(timer);
        timer=setTimeout(function(){
          if(q.length<2){render([]);return;} if(q===lastQ)return; lastQ=q;
          $.get('/ajax/search',{q:q}).done(function(html){render(parseProducts(html));}).fail(function(){render([]);});
        },220);
      });
      $input.on('focus', function(){ if($box.children().length) $box.addClass('is-open'); });
      $(document).on('click', function(e){ if(!$(e.target).closest($form).length) $box.removeClass('is-open'); });
    })();

    initFinder();
  }

  if(window.jQuery){ jQuery(document).ready(initChrome); }
  else { document.addEventListener('DOMContentLoaded', initChrome); }
})();
</script>
