# Produkční nginx – kanonický host: https://mobilmajak.com (bez www)
# Live soubor na VPS: /etc/nginx/sites-enabled/test
#
# www → apex (session cookie je host-only; po sjednocení hostu je login shodný)

# Default catch-all (IP / neznámý host)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /home/webmajak/webapp/frontend/build;
    index index.html;

    location /media/ {
        alias /home/webmajak/webapp/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# www → kanonický apex (HTTPS)
server {
    listen 443 ssl;
    server_name www.mobilmajak.com;
    ssl_certificate /etc/letsencrypt/live/mobilmajak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilmajak.com/privkey.pem;
    return 301 https://mobilmajak.com$request_uri;
}

# Kanonický host (HTTPS)
server {
    listen 443 ssl;
    server_name mobilmajak.com;
    ssl_certificate /etc/letsencrypt/live/mobilmajak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilmajak.com/privkey.pem;

    root /home/webmajak/webapp/frontend/build;
    index index.html;

    location /media/ {
        alias /home/webmajak/webapp/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTP → HTTPS apex (i z www)
server {
    listen 80;
    server_name mobilmajak.com www.mobilmajak.com;
    return 301 https://mobilmajak.com$request_uri;
}
