# Produkční nginx – mobilmajak.com + www (stejná app)
# Live soubor na VPS: /etc/nginx/sites-enabled/test
#
# POZOR: www nesmí 301 na apex pro /api/ — axios pak hlásí ERR_TOO_MANY_REDIRECTS
# (session cookie je host-only; mezidoménový redirect na XHR rozbíjí FE).

# Default catch-all (IP / neznámý host)
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    root /home/webmajak/webapp/frontend/build;
    index index.html;

    location /media/ {
        alias /home/webmajak/webapp/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Hashované CRA assety – dlouhá cache (gzip viz conf.d/mobilmajak-gzip.conf)
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}

# Apex + www (HTTPS) – stejná aplikace
server {
    listen 443 ssl;
    server_name mobilmajak.com www.mobilmajak.com;
    ssl_certificate /etc/letsencrypt/live/mobilmajak.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mobilmajak.com/privkey.pem;

    root /home/webmajak/webapp/frontend/build;
    index index.html;

    location /media/ {
        alias /home/webmajak/webapp/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 20M;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }
}

# HTTP → HTTPS (zachovat host kvůli cookies)
server {
    listen 80;
    server_name mobilmajak.com www.mobilmajak.com;
    return 301 https://$host$request_uri;
}
