# Doplněk k gzip on; v /etc/nginx/nginx.conf
# Live: /etc/nginx/conf.d/mobilmajak-gzip.conf
# Bez tohoto JS/CSS odcházejí nekomprimované (~700 KB main.js).

gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/javascript
    application/x-javascript
    application/json
    application/xml
    application/xml+rss
    application/xhtml+xml
    image/svg+xml
    font/woff
    font/woff2
    application/font-woff
    application/vnd.ms-fontobject;
